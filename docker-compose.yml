services:
  postgres:
    image: postgres:18-alpine
    container_name: doomsday_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: doomsday_ready
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doomsday_ready"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomsday_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/doomsday_ready?schema=public
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doomsday_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
